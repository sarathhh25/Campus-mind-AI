version: '3.8'

services:
  # Vector Database for Knowledge Base
  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: campusmind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Relational Database for Application & User Data
  postgres:
    image: postgres:15-alpine
    container_name: campusmind-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: campusmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # CampusMind Backend API Service
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: campusmind-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/campusmind_db
    depends_on:
      - qdrant
      - postgres
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
